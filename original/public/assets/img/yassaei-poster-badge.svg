<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="نشان یاسایی">
  <!-- نشان پوستری یاسایی — نسخهٔ باکیفیت برداری برای پانویس
       هویت بصری: آبی الکتریک (#3dabff/#1e8ae8) + صاعقه + مدار چاپی -->
  <defs>
    <linearGradient id="ypb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4db9ff"/>
      <stop offset=".55" stop-color="#2196f0"/>
      <stop offset="1" stop-color="#1367b8"/>
    </linearGradient>
    <linearGradient id="ypb-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dceefd"/>
    </linearGradient>
    <linearGradient id="ypb-bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3dabff"/>
      <stop offset="1" stop-color="#1565ae"/>
    </linearGradient>
    <radialGradient id="ypb-glow" cx=".3" cy=".25" r=".9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ypb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#0a4d8f" flood-opacity=".38"/>
    </filter>
  </defs>

  <!-- بدنهٔ نشان با سایهٔ نرم -->
  <g filter="url(#ypb-shadow)">
    <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#ypb-bg)"/>
  </g>
  <!-- جلای نور و لبهٔ داخلی حلقه‌ای (حس نشان/مدال) -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#ypb-glow)"/>
  <rect x="12.5" y="12.5" width="95" height="95" rx="23" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.6"/>
  <rect x="16.5" y="16.5" width="87" height="87" rx="20" fill="none" stroke="#0c4f8f" stroke-opacity=".28" stroke-width="1.2"/>

  <!-- پین‌های مدار چاپی دور نشان (امضای بصری یاسایی) -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".92">
    <path d="M34 24v8M47 24v8M60 24v8M73 24v8M86 24v8"/>
    <path d="M34 88v8M47 88v8M60 88v8M73 88v8M86 88v8"/>
    <path d="M24 34h8M24 47h8M24 60h8M24 73h8M24 86h8"/>
    <path d="M88 34h8M88 47h8M88 60h8M88 73h8M88 86h8"/>
  </g>
  <!-- گره‌های مدار (نقطه‌های سرِ پین) -->
  <g fill="#ffffff" opacity=".95">
    <circle cx="34" cy="21" r="2.1"/><circle cx="47" cy="21" r="2.1"/><circle cx="60" cy="21" r="2.1"/><circle cx="73" cy="21" r="2.1"/><circle cx="86" cy="21" r="2.1"/>
    <circle cx="34" cy="99" r="2.1"/><circle cx="47" cy="99" r="2.1"/><circle cx="60" cy="99" r="2.1"/><circle cx="73" cy="99" r="2.1"/><circle cx="86" cy="99" r="2.1"/>
    <circle cx="21" cy="34" r="2.1"/><circle cx="21" cy="47" r="2.1"/><circle cx="21" cy="60" r="2.1"/><circle cx="21" cy="73" r="2.1"/><circle cx="21" cy="86" r="2.1"/>
    <circle cx="99" cy="34" r="2.1"/><circle cx="99" cy="47" r="2.1"/><circle cx="99" cy="60" r="2.1"/><circle cx="99" cy="73" r="2.1"/><circle cx="99" cy="86" r="2.1"/>
  </g>

  <!-- مسیرهای ظریف مدار در چهار گوشهٔ داخلی -->
  <g stroke="#ffffff" stroke-opacity=".35" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M30 40c6 0 8 2 8 8"/>
    <path d="M90 40c-6 0-8 2-8 8"/>
    <path d="M30 80c6 0 8-2 8-8"/>
    <path d="M90 80c-6 0-8-2-8-8"/>
  </g>

  <!-- هستهٔ مرکزی: مربع سفید گردگوشه با صاعقهٔ آبی -->
  <rect x="34" y="34" width="52" height="52" rx="13" fill="url(#ypb-core)"/>
  <path d="M64.5 40 48 63h9.5L54.5 80 72 57h-9.5z" fill="url(#ypb-bolt)"/>

  <!-- جرقه‌های کوچک انرژی دو طرف صاعقه -->
  <g fill="#3dabff" opacity=".85">
    <path d="M40 45l1.5 3.4L45 50l-3.5 1.6L40 55l-1.5-3.4L35 50l3.5-1.6z"/>
    <path d="M81 66l1.2 2.7 2.8 1.3-2.8 1.3L81 74l-1.2-2.7-2.8-1.3 2.8-1.3z"/>
  </g>
</svg>
