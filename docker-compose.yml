# ── Yassaei Electronics — Frontend (Next.js) + Backend (Bun API) ──
# Usage:
#   docker compose up -d --build          # start both services
#   docker compose logs -f                # follow logs
#   docker compose down                   # stop (data persists in yassaei-data volume)
#
# Frontend  → http://localhost:3000  (UI; /api/* proxied to backend)
# Backend   → http://localhost:4000  (REST API, also reachable directly)

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: yassaei-backend
    restart: unless-stopped
    environment:
      - PORT=4000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Yassaei@1404}
    volumes:
      - yassaei-data:/app/data
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:4000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: yassaei-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_URL=http://backend:4000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  yassaei-data:
